<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="max-age=0, no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Order Confirm Center</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" href="/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- SweetAlert for instant feedback -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 0;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: #007bff;
            font-size: 18px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .success-message {
            font-size: 20px;
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Order Confirm Center</h1>
        <div class="success-message">
            <p>Your order has been successfully confirmed!</p>
        </div>
        <a href="/">Back to Home</a>
    </div>

    <!-- Optional: Instant Success Notification on Page Load -->
    <script>
        window.onload = function() {
            Swal.fire({
                title: 'Order Confirmed!',
                text: 'Your order has been successfully confirmed.',
                icon: 'success',
                confirmButtonText: 'OK'
            });
        };
    </script>
</body>
</html>
